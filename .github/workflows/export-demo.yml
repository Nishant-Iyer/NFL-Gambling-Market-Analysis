name: Backtest and export demo data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/export_demo.py"
      - ".github/workflows/export-demo.yml"

permissions:
  contents: write

concurrency:
  group: export-demo
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn xgboost optuna openpyxl

      - name: Walk-forward backtest and export
        run: python -m scripts.export_demo

      - name: Commit results
        run: |
          git config user.name "Nishant Iyer"
          git config user.email "111642900+Nishant-Iyer@users.noreply.github.com"
          git add demo/
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Rerun walk-forward backtest and export demo data"
          git pull --rebase origin main
          git push origin HEAD:main
